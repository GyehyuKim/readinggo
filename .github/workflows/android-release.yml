# 안드로이드 release AAB 빌드 (#1024) — Play 업로드용, 수동 트리거.
# 디버그 APK(android-apk.yml)와 달리 서명된 App Bundle(.aab)을 만들어 Play Console 에 올린다.
# 서명키는 평문 커밋 금지 → GitHub Secret(base64 키스토어 + 비번)을 디코드해 런타임에만 복원.
# 흐름: Secret → keystore.properties + upload-keystore.jks 복원 → Vite build(dist)
#       → cap sync android → gradlew bundleRelease → AAB 아티팩트 업로드.
# 키스토어 생성·Secret 등록 절차(사용자 1회): docs/readinggo/RELEASE-BUILD.md
name: android-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    name: build release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release source branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Android Play release는 main에서만 빌드할 수 있습니다: $GITHUB_REF"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22   # Capacitor 8 CLI 는 Node >=22 요구(cap sync). android-apk.yml 과 동일.

      # Capacitor 8 / AGP 8 = JDK 17+. 21 사용(android-apk.yml 과 동일).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK + 라이선스 자동 수락 + ANDROID_HOME 설정.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # Secret → 업로드 키스토어 + keystore.properties 복원.
      # 4개 Secret 필요(없으면 디코드 결과가 빈 파일 → bundleRelease 실패로 드러남):
      #   RG_UPLOAD_KEYSTORE_BASE64 · RG_KEYSTORE_PASSWORD · RG_KEY_ALIAS · RG_KEY_PASSWORD
      # storeFile 경로는 android/ 루트 기준(build.gradle 의 rootProject.file).
      - name: Restore upload keystore from secrets
        working-directory: docs/readinggo/android
        env:
          RG_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RG_UPLOAD_KEYSTORE_BASE64 }}
          RG_KEYSTORE_PASSWORD: ${{ secrets.RG_KEYSTORE_PASSWORD }}
          RG_KEY_ALIAS: ${{ secrets.RG_KEY_ALIAS }}
          RG_KEY_PASSWORD: ${{ secrets.RG_KEY_PASSWORD }}
        run: |
          if [ -z "$RG_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::RG_UPLOAD_KEYSTORE_BASE64 Secret 미설정 — docs/readinggo/RELEASE-BUILD.md 참고해 4개 Secret 등록 필요."
            exit 1
          fi
          echo "$RG_UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          cat > keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${RG_KEYSTORE_PASSWORD}
          keyAlias=${RG_KEY_ALIAS}
          keyPassword=${RG_KEY_PASSWORD}
          EOF

      # 웹 번들(dist) 빌드 — capacitor webDir=dist.
      - name: Build web bundle (Vite)
        working-directory: docs/readinggo
        env:
          VITE_READINGGO_ENV: production
        run: |
          npm ci
          npm run build

      # 업로드 전에 packaged web assets의 환경과 source lineage를 fail-closed로 고정한다.
      - name: Verify production bundle and embed provenance
        working-directory: docs/readinggo
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function files(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? files(full) : [full];
            });
          }
          const bundle = files('dist')
            .filter((file) => /\.(?:html|js|css|json)$/.test(file))
            .map((file) => fs.readFileSync(file, 'utf8'))
            .join('\n');
          const productionApi = 'https://readinggo.hyuniverse.workers.dev';
          if (!bundle.includes(productionApi)) {
            throw new Error(`production API가 packaged assets에 없습니다: ${productionApi}`);
          }
          for (const forbidden of ['https://readinggo-dev.hyuniverse.workers.dev', '개발 검수 모드']) {
            if (bundle.includes(forbidden)) throw new Error(`DEV 문자열이 packaged assets에 포함됨: ${forbidden}`);
          }
          fs.writeFileSync('dist/release-provenance.json', JSON.stringify({
            environment: 'production',
            sourceSha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
          }, null, 2) + '\n');
          NODE

      # dist → android 동기화 + 네이티브 플러그인 반영.
      - name: Capacitor sync (android)
        working-directory: docs/readinggo
        run: npx cap sync android

      # 서명된 release AAB(Play 업로드)와 APK(직접 설치·아카이브)를 같은 소스·키로 빌드한다.
      # build.gradle 이 keystore.properties 를 읽어 release 서명을 연결한다.
      - name: Gradle bundleRelease and assembleRelease
        working-directory: docs/readinggo/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      # 빌드 끝나면 복원한 키스토어·비번 삭제(아티팩트·로그 유출 방지).
      - name: Clean up keystore
        if: always()
        working-directory: docs/readinggo/android
        run: rm -f upload-keystore.jks keystore.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readinggo-release-aab-${{ github.sha }}
          path: docs/readinggo/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readinggo-release-apk-${{ github.sha }}
          path: docs/readinggo/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
