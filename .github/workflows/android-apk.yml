# 안드로이드 디버그 APK 빌드 (#1003) — 수동 트리거.
# 로컬 툴체인(JDK·SDK) 없이 GitHub 러너에서 빌드 → app-debug.apk 아티팩트.
# 흐름: Vite build(dist) → cap sync android → gradlew assembleDebug.
# 디버그 서명(러너 생성 debug.keystore)이라 테스트 설치용. release 서명은 별도(#873 후).
name: android-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # Capacitor 8 CLI 는 Node >=22 요구(cap sync). #1003

      # Capacitor 8 / AGP 8 = JDK 17+. 21 사용(안전).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK + 라이선스 자동 수락 + ANDROID_HOME 설정.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # 웹 번들(dist) 빌드 — capacitor webDir=dist. DEV DB/API만 사용하도록 명시 주입한다.
      - name: Build DEV web bundle (Vite)
        working-directory: docs/readinggo
        env:
          VITE_READINGGO_ENV: development
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_ORIGIN: https://readinggo-dev.hyuniverse.workers.dev
          VITE_NATIVE_REDIRECT_SCHEME: com.readinggo.app.dev
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm ci
          npm run build
          grep -R -q 'readinggo-dev.hyuniverse.workers.dev' dist
          ! grep -R -q 'cttllwwkaddghqttyhkg.supabase.co' dist

      # DEV 검수 앱은 production OTA 채널을 절대 구독하지 않는다(#1489).
      # defaultChannel=beta를 override — 네이티브가 이 값을 첫 체크 요청부터 defaultChannel
      # 필드로 싣으므로(런타임 JS 불필요) 빌드 시점에 beta로 결정적으로 고정된다.
      # OTA 자체를 끄지 않는다 — 꺼두면 beta 채널 회귀 검증이 애초에 안 된다.
      - name: Pin DEV APK to beta OTA channel
        working-directory: docs/readinggo
        run: |
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p));c.appName='ReadingGo DEV';c.plugins.CapacitorUpdater.defaultChannel='beta';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\\n')"
          grep -q 'readinggo.hyuniverse.workers.dev/api/ota' capacitor.config.json
          grep -q '"defaultChannel": "beta"' capacitor.config.json

      # encrypted beta bundle을 실기기에서 검증할 수 있도록 release 셸과 같은 public key를
      # DEV APK에도 내장한다. key가 없거나 저장 뒤 beta 채널이 유실되면 fail-closed 한다.
      - name: Embed OTA verification public key for beta
        working-directory: docs/readinggo
        env:
          OTA_PUBLIC_KEY: ${{ vars.OTA_PUBLIC_KEY }}
        run: |
          test -n "$OTA_PUBLIC_KEY"
          npx -y @capgo/cli@8.41.4 key save --key-data "$OTA_PUBLIC_KEY"
          node -e "const c=require('./capacitor.config.json');if(!c.plugins?.CapacitorUpdater?.publicKey||c.plugins.CapacitorUpdater.defaultChannel!=='beta')process.exit(1)"

      # dist → android 동기화 + 플러그인(capgo 등) 반영.
      - name: Capacitor sync (android)
        working-directory: docs/readinggo
        run: npx cap sync android

      # 디버그 APK 빌드.
      - name: Gradle assembleDebug
        working-directory: docs/readinggo/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readinggo-debug-apk
          path: docs/readinggo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
