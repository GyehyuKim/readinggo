# PR head에는 Cloudflare 편집 토큰을 제공하지 않는다. PR 검증은 localhost smoke만 실행하고,
# DEV edge 업로드는 검토된 main을 checkout하는 수동 job으로 분리한다 (#1398).
name: preview-smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-local-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Build and render PR locally without secrets
        run: |
          cd docs/readinggo
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run preview &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          SMOKE_URL=http://localhost:4173/ npm run smoke

  reviewed-main-edge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Upload reviewed main preview version
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_ORIGIN: https://readinggo-dev.hyuniverse.workers.dev
          VITE_READINGGO_ENV: development
        run: |
          set -o pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('wrangler.dev.toml').read_text()
          output = []
          skipping = False
          for line in source.splitlines():
              if line in ('[[durable_objects.bindings]]', '[[migrations]]'):
                  skipping = True
                  continue
              if skipping and line.startswith('['):
                  skipping = False
              if not skipping:
                  output.append(line)
          rendered = '\n'.join(output) + '\n'
          rendered = rendered.replace('name = "readinggo-dev"', 'name = "readinggo-ui-preview"', 1)
          rendered = rendered.replace('main = "worker/index.mjs"', 'main = ".wrangler.preview.mjs"', 1)
          Path('.wrangler.preview.mjs').write_text("import worker from './worker/index.mjs';\nexport default worker;\n")
          Path('.wrangler.preview.toml').write_text(rendered)
          PY
          OUT=$(npx --yes wrangler@4.118.0 versions upload -c .wrangler.preview.toml \
            --var "SUPABASE_URL:$DEV_SUPABASE_URL" --var "RELEASE_SHA:$GITHUB_SHA" 2>&1 | tee /dev/stderr)
          URL=$(printf '%s\n' "$OUT" | awk '/Version Preview URL:/ {gsub(/.*Version Preview URL: /, ""); print; exit}')
          if [ -z "$URL" ]; then
            npx --yes wrangler@4.118.0 deploy -c .wrangler.preview.toml \
              --var "SUPABASE_URL:$DEV_SUPABASE_URL" --var "RELEASE_SHA:$GITHUB_SHA"
            OUT=$(npx --yes wrangler@4.118.0 versions upload -c .wrangler.preview.toml \
              --var "SUPABASE_URL:$DEV_SUPABASE_URL" --var "RELEASE_SHA:$GITHUB_SHA" 2>&1 | tee /dev/stderr)
            URL=$(printf '%s\n' "$OUT" | awk '/Version Preview URL:/ {gsub(/.*Version Preview URL: /, ""); print; exit}')
          fi
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Render smoke on reviewed main edge
        env:
          SMOKE_URL: ${{ steps.preview.outputs.url }}
        run: |
          cd docs/readinggo
          npm ci
          npx playwright install --with-deps chromium
          SMOKE_URL="${SMOKE_URL%/}/" npm run smoke
