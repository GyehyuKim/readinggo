name: UGC moderation database gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Database action
        required: true
        type: choice
        options: [validate-dev, audit-prod, apply-prod]

jobs:
  database-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run UGC database gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ugc-moderation-db.mjs "${{ github.event_name == 'pull_request' && 'validate-dev' || inputs.mode }}"
