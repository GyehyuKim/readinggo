# OTA beta 릴리스 — 승인된 main SHA를 수동 publish (#876 페이즈 C, 이슈 #982)
#
# 흐름(spec ota.md §4): workflow_dispatch 입력 SHA → stable DEV/main gate
#   → Vite build(dist) → @capgo/cli로 dist zip + SHA-256
#   → R2(readinggo-ota) 업로드 → KV(OTA_KV) `ota:android:beta` 매니페스트 갱신.
#   production 승격은 별도 수동 workflow(ota-promote.yml)로만 수행한다.
#
# 인프라(전부 기설정, 이 워크플로우는 정책 코드만 — 앱/계약 코드 무변경):
#   - Worker /api/ota         : PR #980 머지됨. KV `ota:android:<channel>` JSON 을 읽어 앱에 반환.
#   - KV namespace OTA_KV      : id e22049c87f9d44139242316c3c445bf9 (wrangler.toml 바인딩됨).
#   - R2 bucket readinggo-ota  : PUBLIC 활성. 공개 URL base = https://pub-6a6b161169dd4882a91d87901685fa58.r2.dev
#                                (키 X 로 올린 객체는 <base>/X 로 다운로드 가능).
#   - 시크릿                    : CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID (preview-smoke 와 공유, repo Settings→Secrets).
#
# 안전망: @capgo/cli `bundle zip`의 updater 의존성·notifyAppReady() 검사를 유지한다.
# 부팅 준비 신호를 보장하지 못하는 번들은 publish하지 않는다.
#
# semver 규칙: @capgo/cli 는 비-semver(예: 2026.06.24-sha)를 invalid_semver 로 거부한다.
#   → 버전은 `1.0.<run_number>`(단조 증가). git sha·날짜는 매니페스트 METADATA(sha/date)로만 싣는다
#   (워커는 version/url/checksum/minNative 만 사용 — sha/date 는 운영 추적용 무해 필드).
name: ota-release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: stable dev에서 검증된 main SHA
        required: true
        type: string

# 연속 수동 실행 시 직렬화(KV/R2 동시 쓰기로 인한 매니페스트-자산 불일치 방지). 진행 중인 릴리스는 취소 안 함.
concurrency:
  group: ota-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ota-release:
    name: build → zip → R2 → KV(beta)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Gate on main HEAD and stable DEV receipt
        env:
          APPROVED_SHA: ${{ inputs.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse origin/main)" = "$APPROVED_SHA"
          curl -fsS https://readinggo-dev.hyuniverse.workers.dev/api/release > /tmp/dev-release.json
          test "$(jq -r .environment /tmp/dev-release.json)" = development
          test "$(jq -r .sha /tmp/dev-release.json)" = "$APPROVED_SHA"

      # Vite 빌드 → docs/readinggo/dist. @capgo/capacitor-updater 도 여기서 설치됨(#983 의존성, zip 검사 통과 전제).
      - name: Build web bundle (Vite)
        working-directory: docs/readinggo
        env:
          VITE_READINGGO_ENV: production
        run: |
          npm ci
          npm run build

      # dist 를 zip + sha256 hex. --json 으로 filename/checksum 파싱.
      # 버전 = 1.0.<run_number>(semver, 단조). code-check 유지(notifyAppReady 안전망, #983 필요).
      # 출력: com.readinggo.app_<version>.zip (dist 내용물 zip), JSON {"bundle","filename","checksum"}.
      - name: Bundle zip + checksum (Capgo CLI)
        id: bundle
        working-directory: docs/readinggo
        env:
          VERSION: 1.0.${{ github.run_number }}
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          set -o pipefail
          test -n "$OTA_PRIVATE_KEY"
          OUT=$(npx -y @capgo/cli@8.41.4 bundle zip com.readinggo.app --path dist --bundle "$VERSION" --json)
          echo "$OUT"
          FILENAME=$(printf '%s' "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/\{[\s\S]*\}/);process.stdout.write(JSON.parse(m[0]).filename)})')
          CHECKSUM=$(printf '%s' "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/\{[\s\S]*\}/);process.stdout.write(JSON.parse(m[0]).checksum)})')
          if [ -z "$FILENAME" ] || [ -z "$CHECKSUM" ]; then
            echo "::error::capgo --json 에서 filename/checksum 추출 실패. 출력 위 참고."
            exit 1
          fi
          if [ ! -f "$FILENAME" ]; then
            echo "::error::zip 파일이 없음: $FILENAME (cwd=$(pwd))"
            exit 1
          fi
          # Capgo v2 envelope: private key로 bundle/checksum을 보호한다. 앱 셸에 내장된 publicKey만
          # sessionKey/checksum을 검증·복호화할 수 있어 R2/KV 쓰기 권한만 탈취한 공격자는 실행 가능한
          # OTA를 만들 수 없다. 평문 zip은 암호화 직후 삭제한다.
          ENCRYPTED=$(npx -y @capgo/cli@8.41.4 bundle encrypt "$FILENAME" "$CHECKSUM" --key-data "$OTA_PRIVATE_KEY" --json)
          ENCRYPTED_FILENAME=$(printf '%s' "$ENCRYPTED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/\{[\s\S]*\}/);process.stdout.write(JSON.parse(m[0]).filename)})')
          ENCRYPTED_CHECKSUM=$(printf '%s' "$ENCRYPTED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/\{[\s\S]*\}/);process.stdout.write(JSON.parse(m[0]).checksum)})')
          SESSION_KEY=$(printf '%s' "$ENCRYPTED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/\{[\s\S]*\}/);process.stdout.write(JSON.parse(m[0]).ivSessionKey)})')
          test -n "$ENCRYPTED_FILENAME" && test -f "$ENCRYPTED_FILENAME"
          test -n "$ENCRYPTED_CHECKSUM"
          if [ -z "$SESSION_KEY" ] || [ "$SESSION_KEY" != "$(printf '%s' "$SESSION_KEY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(s.trim()))')" ]; then
            echo "::error::Capgo encrypted session key가 비었거나 앞뒤 공백을 포함함"
            exit 1
          fi
          echo "::add-mask::$SESSION_KEY"
          rm -f "$FILENAME"
          {
            echo "version=$VERSION"
            echo "filename=$ENCRYPTED_FILENAME"
            echo "checksum=$ENCRYPTED_CHECKSUM"
            echo "session-key=$SESSION_KEY"
          } >> "$GITHUB_OUTPUT"
          echo "✅ encrypted OTA bundle created: $ENCRYPTED_FILENAME"

      # OTA 네이티브 하한의 단일 원천은 실제 Android 셸 versionCode다.
      # Gradle 값이 없거나 중복되면 publish 전에 실패해 stale 하드코딩을 차단한다(#1441).
      - name: Read Android native versionCode
        id: native
        working-directory: docs/readinggo
        run: |
          VERSION_CODE=$(node -e '
            const source = require("node:fs").readFileSync("android/app/build.gradle", "utf8");
            const matches = [...source.matchAll(/^\s*versionCode\s+(\d+)\s*$/gm)];
            if (matches.length !== 1) throw new Error("expected one Android versionCode, found " + matches.length);
            const versionCode = Number(matches[0][1]);
            if (!Number.isSafeInteger(versionCode) || versionCode < 5) throw new Error("encrypted OTA requires Android versionCode >= 5");
            process.stdout.write(String(versionCode));
          ')
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "✅ Android native versionCode: $VERSION_CODE"

      # R2(public) 업로드 → 공개 URL = <base>/<filename> 로 앱이 다운로드.
      - name: Upload bundle to R2
        working-directory: docs/readinggo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FILENAME: ${{ steps.bundle.outputs.filename }}
        run: |
          # --remote 필수: wrangler v4 는 local-first(기본=로컬 miniflare). 빼면 실제 R2 에 안 올라가고
          #   job 은 success 로 끝난다(로그에 "Resource location: local"). #990.
          npx -y wrangler@4.118.0 r2 object put "readinggo-ota/${FILENAME}" \
            --file "${FILENAME}" \
            --content-type application/zip \
            --remote

      # beta 채널 매니페스트 갱신. 워커는 version·url·checksum·sessionKey·minNative 를 사용.
      # minNative 는 위에서 Android build.gradle versionCode 를 읽어 자동 설정한다. 새 네이티브 API를
      # 쓰는 번들은 구 셸에서 스킵된다(spec §1·§5, 크래시 원천 차단).
      # sha/date: 운영 추적용 메타데이터(워커 무시). semver 가 git sha 를 못 담으므로 여기 별도 기록.
      - name: Publish beta manifest to KV
        working-directory: docs/readinggo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.bundle.outputs.version }}
          FILENAME: ${{ steps.bundle.outputs.filename }}
          CHECKSUM: ${{ steps.bundle.outputs.checksum }}
          SESSION_KEY: ${{ steps.bundle.outputs.session-key }}
          GIT_SHA: ${{ github.sha }}
          MIN_NATIVE: ${{ steps.native.outputs.version-code }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://pub-6a6b161169dd4882a91d87901685fa58.r2.dev/${FILENAME}"
          # JSON 은 node 로 안전하게 직렬화(따옴표/이스케이프 사고 방지).
          MANIFEST=$(VERSION="$VERSION" URL="$URL" CHECKSUM="$CHECKSUM" SESSION_KEY="$SESSION_KEY" GIT_SHA="$GIT_SHA" DATE="$DATE" node -e '
            const o = {
              version: process.env.VERSION,
              url: process.env.URL,
              checksum: process.env.CHECKSUM,
              sessionKey: process.env.SESSION_KEY,
              minNative: Number(process.env.MIN_NATIVE),
              sha: process.env.GIT_SHA,
              date: process.env.DATE,
            };
            process.stdout.write(JSON.stringify(o));
          ')
          printf '%s' "$MANIFEST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);const validString=v=>typeof v==="string"&&v.length>0&&v===v.trim();let validUrl=false;if(validString(m.url)){try{const u=new URL(m.url);validUrl=u.protocol==="https:"&&!u.username&&!u.password}catch{}}const validChecksum=typeof m.checksum==="string"&&/^[a-f0-9]{64}$/i.test(m.checksum);const validMin=Number.isSafeInteger(m.minNative)&&m.minNative>=5;if(!validString(m.version)||!validUrl||!validChecksum||!validString(m.sessionKey)||!validMin){console.error("invalid encrypted manifest: version/url/checksum/sessionKey/minNative");process.exit(1)}})'
          # --remote 필수: 없으면 로컬 KV 에만 쓰여 실제 매니페스트가 안 올라간다(#990).
          npx -y wrangler@4.118.0 kv key put --remote --namespace-id e22049c87f9d44139242316c3c445bf9 \
            "ota:android:beta" "$MANIFEST"
          {
            echo "### OTA beta published 🚀"
            echo ""
            echo "- version: \`$VERSION\`"
            echo "- url: $URL"
            echo "- checksum: \`$CHECKSUM\`"
            echo "- minNative: \`$MIN_NATIVE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ beta 매니페스트 갱신: $VERSION → $URL"
