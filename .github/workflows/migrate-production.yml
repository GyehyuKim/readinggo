name: migrate-production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Stable DEV에서 검증한 exact main SHA"
        required: true
        type: string
      migration:
        description: "Production에 적용할 docs/readinggo/supabase SQL 파일명"
        required: true
        type: string

concurrency:
  group: readinggo-production-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: require Production owner
    runs-on: ubuntu-latest
    steps:
      - name: Allow only GyehyuKim
        run: test "$GITHUB_ACTOR" = GyehyuKim

  migrate-production:
    name: apply one DEV-verified migration to Production
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
      - name: Gate exact main SHA and apply migration
        env:
          APPROVED_SHA: ${{ inputs.sha }}
          MIGRATION_FILE: ${{ inputs.migration }}
          DEV_URL: https://readinggo-dev.hyuniverse.workers.dev
          PROD_URL: https://readinggo.hyuniverse.workers.dev
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse origin/main)" = "$APPROVED_SHA"
          curl -fsS "$DEV_URL/api/release" > /tmp/dev-release.json
          test "$(jq -r .environment /tmp/dev-release.json)" = development
          test "$(jq -r .sha /tmp/dev-release.json)" = "$APPROVED_SHA"
          curl -fsS "$PROD_URL/api/release" > /tmp/prod-release.json
          test "$(jq -r .environment /tmp/prod-release.json)" = production
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          filename = os.environ['MIGRATION_FILE']
          if not re.fullmatch(r'[0-9]{2}_[a-z0-9_]+\.sql', filename):
              raise SystemExit('Production migration must be a non-DEV SQL basename')

          path = Path('docs/readinggo/supabase') / filename
          if not path.is_file():
              raise SystemExit(f'migration not found: {path}')
          sql = path.read_text()
          if re.search(r'(?im)^\s*(begin|commit|rollback)\s*;', sql):
              raise SystemExit('migration must not manage its own transaction')

          token = os.environ['SUPABASE_ACCESS_TOKEN']
          def canonical_url_ref(url, expected_environment):
              match = re.fullmatch(r'https://([a-z0-9]+)\.supabase\.co', url.rstrip('/'))
              if not match:
                  raise SystemExit(f'{expected_environment} Supabase URL is not canonical')
              return match.group(1)

          def verify_receipt(path, expected_environment, expected_ref):
              receipt = json.loads(Path(path).read_text())
              if receipt.get('environment') != expected_environment:
                  raise SystemExit(f'{expected_environment} release receipt mismatch')
              if receipt.get('supabaseHost') != f'{expected_ref}.supabase.co':
                  raise SystemExit(f'{expected_environment} release receipt targets another Supabase project')

          refs = {
              'development': canonical_url_ref(os.environ['DEV_SUPABASE_URL'], 'development'),
              'production': canonical_url_ref(os.environ['PROD_SUPABASE_URL'], 'production'),
          }
          if refs['development'] == refs['production']:
              raise SystemExit('DEV and Production Supabase projects must differ')
          verify_receipt('/tmp/dev-release.json', 'development', refs['development'])
          verify_receipt('/tmp/prod-release.json', 'production', refs['production'])

          def query(project_ref, statement):
              request = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{project_ref}/database/query',
                  data=json.dumps({'query': statement}).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'readinggo-production-migration/1.0',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors='replace')[:1000]
                  raise SystemExit(f'Supabase Management API failed ({error.code}): {detail}')

          digest = hashlib.sha256(sql.encode()).hexdigest()
          safe_filename = filename.replace("'", "''")
          safe_digest = digest.replace("'", "''")

          dev_rows = query(
              refs['development'],
              f"select filename, sha256 from public.hermes_dev_migrations where filename = '{safe_filename}';",
          )
          if (
              not isinstance(dev_rows, list)
              or len(dev_rows) != 1
              or dev_rows[0].get('sha256') != digest
          ):
              raise SystemExit('exact migration checksum is not verified in DEV ledger')

          ledger = '''
          create table if not exists public.hermes_prod_migrations (
            filename text primary key,
            sha256 text not null,
            source_sha text not null,
            applied_at timestamptz not null default now()
          );
          alter table public.hermes_prod_migrations enable row level security;
          revoke all on public.hermes_prod_migrations from anon, authenticated;
          '''
          existing = query(
              refs['production'],
              ledger + f"select filename, sha256, source_sha, applied_at from public.hermes_prod_migrations where filename = '{safe_filename}';",
          )
          rows = existing if isinstance(existing, list) else []
          if rows:
              if rows[0].get('sha256') != digest:
                  raise SystemExit('migration filename already applied with a different SHA-256')
              print(json.dumps({'status': 'already_applied', 'migration': filename, 'sha256': digest, 'readback': rows[0]}))
              raise SystemExit(0)

          source_sha = os.environ['APPROVED_SHA'].replace("'", "''")
          transaction = f'''begin;
          {sql}
          insert into public.hermes_prod_migrations(filename, sha256, source_sha)
          values ('{safe_filename}', '{safe_digest}', '{source_sha}');
          commit;'''
          query(refs['production'], transaction)
          verified = query(
              refs['production'],
              f"select filename, sha256, source_sha, applied_at from public.hermes_prod_migrations where filename = '{safe_filename}';",
          )
          if (
              not isinstance(verified, list)
              or len(verified) != 1
              or verified[0].get('sha256') != digest
              or verified[0].get('source_sha') != os.environ['APPROVED_SHA']
          ):
              raise SystemExit('Production migration ledger readback failed')
          print(json.dumps({'status': 'applied', 'migration': filename, 'sha256': digest, 'readback': verified[0]}))
          PY
