# ReadingGo Dev — production과 완전히 별도인 무료 개발 Worker.
# SUPABASE_URL/RELEASE_SHA는 배포 시 --var로 주입하며 project ref를 저장소에 고정하지 않는다.
name = "readinggo-dev"
main = "worker/index.mjs"
compatibility_date = "2026-06-01"
preview_urls = true

[build]
command = "cd docs/readinggo && npm ci && VITE_READINGGO_ENV=development npm run build"

[assets]
directory = "docs/readinggo/dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "APP_KV"
id = "85021e1aabc845fca8e5da1e1ebbbcf4"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1399"
simple = { limit = 30, period = 60 }

[[durable_objects.bindings]]
name = "PROMPT_EXPERIMENT_LIMITER"
class_name = "PromptExperimentLimiter"

[[durable_objects.bindings]]
name = "BOOK_PROVIDER_GUARD"
class_name = "BookProviderGuard"

[[migrations]]
tag = "prompt-experiment-limiter-v1"
new_sqlite_classes = ["PromptExperimentLimiter"]

[[migrations]]
tag = "book-provider-guard-v1"
new_sqlite_classes = ["BookProviderGuard"]

[vars]
ENVIRONMENT = "development"
ARCHIVE_DAILY_CAP = "0"
LLM_BASE_URL = "https://api.upstage.ai/v1"
LLM_MODEL = "solar-pro3"
# Judy용 prompt experiment API (#1330). 인증 토큰은 PROMPT_EXPERIMENT_TOKEN Worker secret.
PROMPT_EXPERIMENT_MINUTE_LIMIT = "60"
PROMPT_EXPERIMENT_DAILY_LIMIT = "1000"
PROMPT_EXPERIMENT_TIMEOUT_MS = "30000"
VISION_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
VISION_MODEL = "gemini-2.5-flash"

# 의도적으로 [triggers]와 R2 binding이 없다. DEV는 cron, prod R2, 문의 GitHub sync를 실행하지 않는다.
